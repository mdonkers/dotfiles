[Login]
#NAutoVTs=6
#ReserveVT=6
#KillUserProcesses=no
#KillOnlyUsers=
#KillExcludeUsers=root
#InhibitDelayMaxSec=5
# Hibernate is deliberately left unused on this machine: swap (29.8 GiB) is smaller
# than RAM (31 GiB), so systemd refuses to write the hibernation image and any
# hibernate action - including the second leg of suspend-then-hibernate - only fails.
# Power key and lid therefore both plain suspend.
# To enable it later, first grow the swap LV past the size of RAM. Resume then also
# needs /etc/initramfs-tools/conf.d/resume to name the swap device; the encrypted LVM
# layout does not use a kernel-command-line resume= argument.
#HandlePowerKey=hibernate
#HandlePowerKey=suspend-then-hibernate
HandlePowerKey=suspend
#HandlePowerKey=poweroff
#HandleSuspendKey=suspend
#HandleHibernateKey=hibernate
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
#PowerKeyIgnoreInhibited=no
#SuspendKeyIgnoreInhibited=no
#HibernateKeyIgnoreInhibited=no
#LidSwitchIgnoreInhibited=yes
#HoldoffTimeoutSec=30s
#IdleAction=ignore
#IdleActionSec=30min
#RuntimeDirectorySize=10%
#RemoveIPC=yes
#InhibitorsMax=8192
#SessionsMax=8192
#UserTasksMax=33%
