[Service]
# Detach Bluetooth and IPU7 before writing the hibernation image. The hook
# stops the camera relay first and restores it after IPU7 reattaches.
# ExecStopPost also restores devices when hibernation is rolled back.
ExecStartPre=/usr/local/bin/hibernate-device-hook pre
ExecStopPost=/usr/local/bin/hibernate-device-hook post
