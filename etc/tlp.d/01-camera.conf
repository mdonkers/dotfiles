# The Synaptics SVP7500 bridge wedges across USB power transitions and takes
# the OV08X40 sensor with it. Leave its kernel-initial power state unchanged.
USB_DENYLIST="06cb:0701"

# The Panther Lake IPU7 firmware can fail CSE re-authentication after runtime
# resume. Unlike RUNTIME_PM_DENYLIST, RUNTIME_PM_DISABLE guarantees "on".
RUNTIME_PM_DISABLE="00:05.0"
