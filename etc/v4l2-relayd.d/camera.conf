# v4l2-relayd instance for the built-in OV08X40 camera.
# Settings are inherited from /etc/default/v4l2-relayd; this file's presence is what makes
# the systemd generator create v4l2-relayd@camera.service.
#
# libcamera configures this sensor for about 28.57fps even though the relay only publishes
# 15fps. Increasing vertical blanking after libcamera reaches PLAYING changes the physical
# sensor to about 14.29fps. In low light this reduced analogue gain by roughly half in
# testing, materially reducing noise. EnvironmentFile values do not expand earlier values,
# so include the inherited idle timeout again in this instance override.
EXTRA_OPTS="--idle-timeout=3 --input-start-control=/dev/ov08x40-camera-sensor:vertical_blanking=2824"
