# Source: github.com/jibsta210/svp7500-camera-fix-pack (Intel IPU7 / OV08X40 camera,
# Panther Lake XPS 16). Pairs with the intel-cvs DKMS module + 99-svp7500-no-autosuspend.
#
# Load the USB-I2C bridge, the CVS controller and the INT3472 power controller
# BEFORE the IPU7 imaging unit.
#
# On these boards the sensors are not on a native I2C controller. They sit
# behind the Synaptics SVP7500, which exposes an I2C tunnel over a USB bulk
# interface. That whole chain -- usbio -> i2c_usbio -> intel_cvs -> INT3472 --
# has to exist before intel_ipu7 goes looking for sensors.
#
# Without this, intel_ipu7 probes first. It finds the sensors the firmware
# declares and starts its own bring-up while the bridge driver is still being
# registered underneath it. Observed on a reporter's machine:
#
#     intel-ipu7 0000:00:05.0: Found supported sensor HIMX1092:00
#     intel-ipu7 0000:00:05.0: Found supported sensor OVTI08F4:00
#     usbcore: registered new interface driver usbio-bridge     <- too late
#     Intel CVS driver i2c-INTC10E1:00: cvs_common_probe        <- too late
#     ... ~9s later ...
#     usbio-bridge 3-3:1.0: Bulk out failed: -110
#     usb 3-3: USB disconnect, device number 2
#
# after which the bridge re-enumerates and fails again, indefinitely, taking
# the i2c adapters, both sensors and the media graph with it every cycle.
#
# A machine with this file loads the bridge stack first and stays up.
softdep intel_ipu7 pre: usbio gpio_usbio i2c_usbio intel_cvs intel_skl_int3472_discrete
